name: Android CI

# 在 GitHub 的 Linux runner 上只产出一个可安装的 release APK：
#   - 版本号由 git tag 驱动（见 app/build.gradle.kts）：tag vX.Y.Z → versionName=X.Y.Z，
#     versionCode 用日期式 yyyyMMdd（HEAD 提交日期），仓库里没有「版本号文件」要手动改
#   - 文件名 = <applicationId>-<versionName>.apk
#   - 校验值单独一个文件 <apk>.sha256（sha256sum 格式，`sha256sum -c` 可直接验）
#   - release 构建没有 signingConfig，AGP 只吐 *-unsigned.apk，这里用 debug keystore 重签；
#     keystore 走 actions/cache，跨 run 保持同一签名，产物之间可覆盖升级
#   - 推 v* tag 时创建 Release：正文 = GitHub 自动生成的 notes + 按 conventional commit
#     分组的提交清单（.github/scripts/changelog.py）
# 发版只需：git tag v1.1.0 && git push --tags
# 单测默认不跑 —— ApiSmokeTest / ApiCoverageTest 直接打 oshwhub.com 线上接口，会随风控波动。

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: '同时运行单元测试（联网打线上接口，可能不稳定）'
        type: boolean
        default: false
      version_name:
        description: '覆盖 versionName（留空则按 git tag 推导）'
        type: string
        default: ''
      version_code:
        description: '覆盖 versionCode（留空则用 HEAD 提交日期 yyyyMMdd，同日重发时用）'
        type: string
        default: ''

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write # tag 推送时创建 Release

env:
  # 用 AGP 那份 debug keystore（~/.android/debug.keystore）给 release 包签名
  KS_ALIAS: androiddebugkey
  KS_PASS: android

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # fetch-depth: 0 是必需的 —— versionName 靠 `git describe --tags`，changelog 靠 tag 区间
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 缓存 ~/.gradle（依赖 + wrapper + build cache），并给 Gradle 注入 CI 友好参数
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      # app/build.gradle.kts 用 compileSdk = 37；装不上就让 AGP 自己补（licence 已接受）
      - name: Install Android SDK platform / build-tools
        run: |
          yes | sdkmanager --install "platforms;android-37" "build-tools;37.0.0" >/dev/null || true
          sdkmanager --list_installed | sed -n '1,40p'

      # 缓存 debug keystore：同一个仓库的多次 run 用同一份签名，产物之间可以覆盖升级
      - name: Restore CI debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ci-debug-keystore-${{ github.repository }}

      # 只构建 release，不会触发 AGP 自动生成 debug keystore，所以这里必须先备好
      - name: Ensure debug keystore
        run: |
          set -euo pipefail
          KS="$HOME/.android/debug.keystore"
          if [ ! -f "$KS" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$KS" -storepass "$KS_PASS" | sed -n '1,10p'

      # 版本号来自 git tag / 提交日期；这里把它落到 GITHUB_ENV，后面命名和 Release 都读它
      - name: Log git version inputs
        run: |
          set -euo pipefail
          echo "describe: $(git describe --tags --long --match 'v[0-9]*' 2>/dev/null || echo '<no tag>')"
          echo "head date: $(git log -1 --format='%cd' --date=short)"
          {
            echo "### 版本信息"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| git describe | \`$(git describe --tags --long --match 'v[0-9]*' 2>/dev/null || echo 'no tag')\` |"
            echo "| HEAD | \`$(git rev-parse --short=7 HEAD)\` |"
            echo "| workflow 覆盖 | name=\`${{ inputs.version_name }}\` code=\`${{ inputs.version_code }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # git 里 gradlew 是 100644（Windows 检出的结果），Linux runner 必须先补执行位
      - name: Build release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ARGS=()
          if [ -n "${{ inputs.version_name }}" ]; then ARGS+=("-Poshwhub.versionName=${{ inputs.version_name }}"); fi
          if [ -n "${{ inputs.version_code }}" ]; then ARGS+=("-Poshwhub.versionCode=${{ inputs.version_code }}"); fi
          ./gradlew --console=plain --stacktrace ${ARGS[@]+"${ARGS[@]}"} :app:assembleRelease

      - name: Unit tests (live network)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
        run: ./gradlew --console=plain --stacktrace :app:testDebugUnitTest

      # 命名 + 签名 + 校验：文件名和版本号都从 AGP 的 output-metadata.json 里读，
      # 不写死版本，也不改仓库里的任何文件
      - name: Sign, name and checksum release APK
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          META=app/build/outputs/apk/release/output-metadata.json
          if [ ! -f "$META" ]; then
            echo "::error::找不到 $META"; ls -R app/build/outputs; exit 1
          fi

          META_TSV="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));e=d["elements"][0];print(d["applicationId"],e["versionName"],e["versionCode"],e["outputFile"],sep="\t")' "$META")"
          IFS=$'\t' read -r app_id vname vcode outfile <<< "$META_TSV"
          echo "app=$app_id versionName=$vname versionCode=$vcode output=$outfile"
          {
            echo "VERSION_NAME=$vname"
            echo "VERSION_CODE=$vcode"
          } >> "$GITHUB_ENV"

          apk="app/build/outputs/apk/release/$outfile"
          if [ ! -f "$apk" ]; then
            apk="$(ls app/build/outputs/apk/release/*-unsigned.apk app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$apk" ] || [ ! -f "$apk" ]; then
            echo "::error::assembleRelease 没产出 APK"; ls -R app/build/outputs/apk; exit 1
          fi
          echo "unsigned: $apk"

          name="${app_id}-${vname}.apk"
          mkdir -p dist

          "$BT/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/release-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" --min-sdk-version 31 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "dist/$name" "$RUNNER_TEMP/release-aligned.apk"
          "$BT/apksigner" verify --print-certs --min-sdk-version 31 "dist/$name"

          # 校验值单独成文件，格式与 sha256sum 输出一致 → 下载后 `sha256sum -c <文件>` 直接过
          ( cd dist && sha256sum "$name" > "$name.sha256" )
          cat "dist/$name.sha256"
          ls -lh dist

          {
            echo ""
            echo "### 产物"
            echo ""
            echo "| APK | versionName | versionCode | 大小 |"
            echo "| --- | --- | --- | --- |"
            echo "| \`$name\` | \`$vname\` | \`$vcode\` | $(du -h "dist/$name" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oshwhub-release-${{ env.VERSION_NAME }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test reports
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14

      # Release 正文先由 GitHub 自动生成（合并的 PR 列表 / Full Changelog / 新贡献者）
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(env.VERSION_NAME, '-') }}

      # 再追加一段按 conventional commit 分组的提交清单：直推 master 不带 PR 时，自动 notes
      # 里只有 Full Changelog 链接，这一段才是真正能读的变更说明。
      # 直接用 REST 而不是 `gh api -F body=@file`：-F 会把 @file 当上传处理，release PATCH
      # 不接受这种形式，服务端只回一个语焉不详的 404。这里自己拼 JSON，并且 --retry 兜住
      # release 刚创建时的短暂可见性延迟。
      - name: Append commit changelog to release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then RANGE="${PREV}..HEAD"; else RANGE="HEAD"; fi
          echo "changelog range: $RANGE (prev=${PREV:-<none>})"
          python3 .github/scripts/changelog.py --range "$RANGE" > "$RUNNER_TEMP/commits.md"
          if [ ! -s "$RUNNER_TEMP/commits.md" ]; then
            echo "没有可追加的提交清单，跳过"
            exit 0
          fi
          python3 - "$TAG_NAME" "$RUNNER_TEMP/commits.md" <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          tag, commits_path = sys.argv[1], sys.argv[2]
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          api = f"https://api.github.com/repos/{repo}/releases/tags/{tag}"
          hdr = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "oshwhub-ci",
          }
          marker = "<!-- oshwhub-commit-changelog -->"

          def call(url, method="GET", payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              h = dict(hdr)
              if data is not None:
                  h["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=h, method=method)
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read().decode()
                  return json.loads(raw) if raw.strip() else {}

          rel = None
          for attempt in range(1, 6):
              try:
                  rel = call(api)
                  break
              except urllib.error.HTTPError as e:
                  detail = e.read().decode()[:200]
                  print(f"读取 release 第 {attempt} 次失败 {e.code}: {detail}")
                  if e.code in (403, 404) and attempt < 5:
                      time.sleep(3 * attempt)
                      continue
                  sys.exit(0) if e.code in (403, 404) else sys.exit(1)

          if rel is None:
              print("::warning::拿不到 release，跳过追加（APK 已上传，不影响产物）")
              sys.exit(0)

          old = (rel.get("body") or "").rstrip()
          if marker in old:
              old = old.split(marker)[0].rstrip()
          commits = open(commits_path, encoding="utf-8").read().strip()
          body = f"{old}\n\n{marker}\n{commits}\n" if old else f"{commits}\n"

          try:
              call(api, "PATCH", {"body": body})
              print("release notes 已追加提交清单")
          except urllib.error.HTTPError as e:
              print(f"::warning::PATCH 失败 {e.code}: {e.read().decode()[:300]}")
          PY
          echo "release notes 追加完成" >> "$GITHUB_STEP_SUMMARY"
